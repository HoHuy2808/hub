services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookstore
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    restart: always
  
  redis:
    image: redis:7
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    restart: always

volumes:
  db_data:
  redis_data: